# Known advisories and updates for the npm dependencies and the actions the
# workflows use. Minor and patch updates come grouped in one pull request
# per ecosystem, so there is one PR to check per week, not ten.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # execa 6+ is ESM-only and changes the API the executor depends on,
      # so it is a planned change, not a weekly bump.
      - dependency-name: execa
        update-types: [version-update:semver-major]
      # The Node types follow the oldest Node line polyman supports, they
      # move by hand when engines moves.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
