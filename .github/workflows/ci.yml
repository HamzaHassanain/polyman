name: CI

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
  # runs the Windows and macOS lanes on any branch, on demand
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check Format
      run: npm run format:check

    - name: Check Lint
      run: npm run lint

    - name: Run Tests with Coverage
      # `vitest run --coverage` executes the suite once (no watch mode) and
      # writes lcov/html/json output under coverage/.
      run: npm run test:coverage

    - name: Upload coverage to Codecov
      # Only upload from one matrix leg to avoid duplicate reports per commit.
      if: matrix.node-version == '22.x'
      uses: codecov/codecov-action@v7
      with:
        files: coverage/lcov.info
        fail_ci_if_error: false
        # Public repos don't strictly need a token, but providing one (via
        # repository secrets) avoids Codecov rate limits and tokenless flakes.
        token: ${{ secrets.CODECOV_TOKEN }}
      continue-on-error: true

    - name: Upload coverage artifact
      if: matrix.node-version == '22.x'
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: coverage/
        retention-days: 14

    - name: Build
      run: npm run build

  # The two operating systems polyman's users have besides Linux. They run on
  # pushes to the default branch and on demand (workflow_dispatch), not on every
  # pull request: macOS minutes cost more. Reported, not blocking.

  # Windows: the unit tests on Node 22. The corpus doesn't run here yet:
  # testlib validators expect CR LF on Windows (corpus/README.md). Open on this
  # lane: #94, #95.
  windows:
    name: Unit tests (Windows, Node 22)
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 50
    continue-on-error: true

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js 22
      uses: actions/setup-node@v7
      with:
        node-version: 22.x
        cache: 'npm'

    - run: node --version

    - name: Install dependencies
      run: npm ci --no-audit --no-fund

    - name: Build
      run: npm run build

    - name: Run Tests
      run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=junit-windows.xml

    - name: Upload test results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: junit-windows
        path: junit-windows.xml
        retention-days: 14

  # macOS: the corpus with GNU g++ from Homebrew (Apple clang has no
  # <bits/stdc++.h>). On macOS `ulimit -v` fails and the command still runs:
  # the spike for #89 found 5/5 problems match with and without it.
  macos:
    name: Corpus (macOS, GNU g++)
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 50
    continue-on-error: true
    env:
      # the same compile limit as the Linux corpus jobs (.github/workflows/corpus.yml, #88)
      POLYMAN_COMPILE_TIMEOUT_MS: '60000'

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js 22
      uses: actions/setup-node@v7
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Use Java 17
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'

    - name: Use Python 3 (reachable as python)
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: npm ci --no-audit --no-fund

    - name: Put GNU g++ first on PATH
      run: |
        brew install gcc
        GXX=$(ls "$(brew --prefix)"/bin/g++-[0-9]* | sort -V | tail -1)
        mkdir -p "$HOME/gnu" && ln -sf "$GXX" "$HOME/gnu/g++"
        echo "$HOME/gnu" >> "$GITHUB_PATH"

    - run: g++ --version | head -1

    - name: Build
      run: npm run build

    - run: node dist/cli.js --version

    - name: Run the corpus
      run: node corpus/run.mjs --junit corpus/out/junit-macos.xml

    - name: Upload the verdicts
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: corpus-verdicts-macos
        path: corpus/out/
        retention-days: 30
