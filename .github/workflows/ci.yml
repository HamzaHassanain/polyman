name: CI

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build and Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check Format
      run: npm run format:check

    - name: Check Lint
      run: npm run lint

    - name: Run Tests with Coverage
      # `vitest run --coverage` executes the suite once (no watch mode) and
      # writes lcov/html/json output under coverage/.
      run: npm run test:coverage

    - name: Upload coverage to Codecov
      # Only upload from one matrix leg to avoid duplicate reports per commit.
      if: matrix.node-version == '20.x'
      uses: codecov/codecov-action@v4
      with:
        files: coverage/lcov.info
        fail_ci_if_error: false
        # Public repos don't strictly need a token, but providing one (via
        # repository secrets) avoids Codecov rate limits and tokenless flakes.
        token: ${{ secrets.CODECOV_TOKEN }}
      continue-on-error: true

    - name: Upload coverage artifact
      if: matrix.node-version == '20.x'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/
        retention-days: 14

    - name: Build
      run: npm run build
